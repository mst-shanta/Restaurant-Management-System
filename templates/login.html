{% extends 'base.html' %}

{% block title %}
Login | Restaurant Management System
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Login
                        </h2>

                        <p class="text-muted">
                            Login to your account
                        </p>

                    </div>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Role -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Login As
                            </label>

                            <select
                                name="role"
                                class="form-select"
                                required
                            >

<option value="">
    Select your role
</option>

<option
    value="customer"
    {% if selected_role == 'customer' %}selected{% endif %}
>
    Customer
</option>

<option
    value="staff"
    {% if selected_role == 'staff' %}selected{% endif %}
>
    Staff
</option>

<option
    value="admin"
    {% if selected_role == 'admin' %}selected{% endif %}
>
    Administrator
</option>

                            </select>

                        </div>


                        <!-- Username -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                required
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- Login -->

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg"
                            >
                                Login
                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-4">

                        <p class="text-muted mb-0">
                            Don't have an account?
                            <a href="{% url 'register' %}">
                                Register
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
